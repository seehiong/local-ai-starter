<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with dark theme gradient -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <!-- Glistening Gradient Brain/Core Symbol -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="192" cy="192" r="36" fill="url(#grad)" />
    <!-- Connected Orbits / Synaptic Rings -->
    <circle cx="192" cy="192" r="100" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.6" stroke-dasharray="10 15" />
    <circle cx="192" cy="192" r="150" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.3" />
    <!-- Neural Node Points -->
    <circle cx="92" cy="192" r="16" fill="#3b82f6" />
    <circle cx="292" cy="192" r="16" fill="#ec4899" />
    <circle cx="192" cy="92" r="16" fill="#8b5cf6" />
    <circle cx="192" cy="292" r="16" fill="#3b82f6" />
    <circle cx="121" cy="121" r="12" fill="#8b5cf6" />
    <circle cx="263" cy="263" r="12" fill="#ec4899" />
    <!-- Connection lines -->
    <line x1="192" y1="192" x2="92" y2="192" stroke="#3b82f6" stroke-width="4" opacity="0.7" />
    <line x1="192" y1="192" x2="292" y2="192" stroke="#ec4899" stroke-width="4" opacity="0.7" />
    <line x1="192" y1="192" x2="192" y2="92" stroke="#8b5cf6" stroke-width="4" opacity="0.7" />
    <line x1="192" y1="192" x2="192" y2="292" stroke="#3b82f6" stroke-width="4" opacity="0.7" />
    <line x1="192" y1="192" x2="121" y2="121" stroke="#8b5cf6" stroke-width="3" opacity="0.5" />
    <line x1="192" y1="192" x2="263" y2="263" stroke="#ec4899" stroke-width="3" opacity="0.5" />
  </g>
</svg>
